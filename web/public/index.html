<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111214"><title>DiscordX builder</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><a class="wordmark" href="./" aria-label="DiscordX home">Discord<span>X</span></a></header>
<div class="tabs" role="tablist" aria-label="APK source"><button id="download-tab" role="tab" aria-selected="true" aria-controls="download-panel">Download Discord</button><button id="local-tab" role="tab" aria-selected="false" aria-controls="local-panel" tabindex="-1">Local APKs</button></div>
<form id="builder"><section class="panel">
<div id="download-panel" role="tabpanel" aria-labelledby="download-tab"><label for="version">Discord build</label><select id="version"><option>356207 · Alpha</option></select></div>
<div id="local-panel" role="tabpanel" aria-labelledby="local-tab" hidden><label for="files" class="dropzone"><strong>Choose Discord APKs</strong><span>Original base + CPU split + hdpi split</span><input id="files" type="file" accept=".apk" multiple></label><p id="file-list" class="help">No files selected.</p></div>
<label for="architecture">CPU architecture</label><select id="architecture"><option value="arm64-v8a">arm64</option><option value="x86_64">x86_64</option></select>
</section><button type="submit" id="build">Download &amp; build APK</button><button type="button" id="cancel" hidden>Cancel build</button></form>
<section id="status-panel" class="panel" hidden><div class="status-heading"><h2 id="status" role="status">Building…</h2><span id="elapsed"></span></div><progress id="progress" aria-label="Build in progress"></progress><pre id="log" aria-label="Build log" tabindex="0"></pre><p id="error" role="alert" hidden></p><a id="result" class="primary" hidden>Download DiscordX APK</a></section>
</main><script type="module" src="app.mjs"></script></body></html>
